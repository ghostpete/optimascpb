{% load static %}

<nav class="navbar navbar-expand navbar-light navbar-bg">
  <a class="sidebar-toggle js-sidebar-toggle">
    <i class="hamburger align-self-center"></i>
  </a>

  <div class="navbar-collapse collapse">
    <ul class="navbar-nav navbar-align">
      <!-- 👤 Profile Dropdown -->
      <li class="nav-item dropdown d-flex align-items-center">
        <a
          class="nav-icon dropdown-toggle d-inline-block d-sm-none"
          href="#"
          data-bs-toggle="dropdown"
        >
          <i class="align-middle" data-feather="settings"></i>
        </a>

        <a
          class="nav-link dropdown-toggle d-sm-inline-block"
          href="#"
          data-bs-toggle="dropdown"
        >
          <img
            src="{{user.get_profile_image_url}}"
            id="profileImageNav"
            style="
              border-radius: 50%;
              border: 2px solid #222296;
              object-fit: cover;
            "
            class="avatar me-1"
            alt="{{user.get_user_fullname}}"
          />
          <span class="text-dark d-none d-sm-inline">
            {{ user.get_user_fullname }}
          </span>
        </a>

        <div class="dropdown-menu dropdown-menu-end">
          <a class="dropdown-item" href="{% url 'settings' %}">
            <i class="align-middle me-1" data-feather="user"></i> Profile
          </a>

          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="{% url 'accounts' %}">
            <i class="align-middle me-1" data-feather="dollar-sign"></i>
            Accounts
          </a>
          <a class="dropdown-item" href="{% url 'support' %}">
            <i class="align-middle me-1" data-feather="help-circle"></i> Help
            Center
          </a>

          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="{% url 'logout' %}">Log out</a>
        </div>
      </li>
    </ul>
  </div>
</nav>

<!-- ✅ Fixed Google Translate Button -->
<div id="google_translate_element"></div>

<script>
  const pathname = location.pathname;
  if (pathname === "/dashboard/") {
    document.getElementById("profileImageNav").style.display = "none";
  }
</script>

<!-- ✅ Google Translate Integration -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: "en",
        includedLanguages:
          "en,fr,es,de,it,pt,zh-CN,ar,ru,ja,ko,hi,tr,nl,pl,sv,da,fi,no,id,th,he,uk,el,cs,vi",
        layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL,
      },
      "google_translate_element"
    );
  }
</script>
<script
  type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
></script>

<!-- ✅ Styling -->
<style>
  /* Fixed position for the translate button */
  #google_translate_element {
    position: fixed;
    bottom: 0px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    /* background-color: #134e4a; teal-900 */
    border-radius: 8px;
    padding: 6px 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  .goog-te-gadget {
    font-size: 0 !important;
  }

  .goog-te-gadget .goog-te-combo {
    font-size: 13px !important;
    border: none;
    border-radius: 6px;
    padding: 6px 8px;
    background-color: #ffffff;
    color: #134e4a;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .goog-te-gadget .goog-te-combo:hover {
    background-color: #f1f5f9;
  }

  /* Hide Google top banner */
  .goog-te-banner-frame.skiptranslate {
    display: none !important;
  }

  body {
    top: 0px !important;
  }
</style>
